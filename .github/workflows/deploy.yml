name: build-and-deploy

# BitWeb is a pure static build: GitHub installs dependencies, builds the
# app, and publishes dist/ to GitHub Pages. No other service is involved.
#
# Phone-friendly update flow: upload ONE file - source.zip - through the
# GitHub web UI ("Add file" -> "Upload files"). The first step below
# detects the zip, unpacks it over the repo, commits the result, and the
# build continues with the fresh sources. The zip deletes itself, so the
# follow-up run is a plain rebuild.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit back the unpacked source.zip
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source.zip if present
        run: |
          if [ -f source.zip ]; then
            echo "source.zip found - unpacking over the repo"
            mkdir -p .unpack
            unzip -oq source.zip -d .unpack
            rsync -a --delete \
              --exclude=.git --exclude=.unpack --exclude=source.zip \
              .unpack/ ./
            rm -rf .unpack source.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: unpack source.zip" || echo "nothing to commit"
            git push || echo "push skipped"
          else
            echo "no source.zip - plain build"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static app
        run: npm run build

      # Pages serves 404.html for unknown paths; shipping the app as
      # 404.html keeps in-app navigation working on refresh/direct links.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
